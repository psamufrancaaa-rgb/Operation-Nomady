

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q "$(find . -maxdepth 1 -name '*.zip' | head -n 1)" -d projeto

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          DIR=$(dirname "$(find projeto -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          cd "$DIR"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: Operacao-Normandy-APK
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
